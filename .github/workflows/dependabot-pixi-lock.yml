name: Dependabot pixi.lock

on:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml

permissions:
  contents: write
  actions: write

jobs:
  relock:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      # Install directly because the repository's Actions policy blocks setup-pixi.
      - name: Install Pixi
        shell: bash
        env:
          PIXI_NO_PATH_UPDATE: "1"
        run: |
          curl --fail --silent --show-error --location https://pixi.sh/install.sh --output "$RUNNER_TEMP/install-pixi.sh"
          bash "$RUNNER_TEMP/install-pixi.sh"
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Update pixi.lock
        run: pixi lock

      - name: Commit and push pixi.lock
        id: push
        run: |
          if git diff --quiet -- pixi.lock; then
            echo "pixi.lock already up to date"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add pixi.lock
          git commit -m "chore: update pixi.lock"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger pull_request events, so CI must be dispatched explicitly.
      - name: Run CI on the updated commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
