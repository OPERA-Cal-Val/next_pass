name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  call-pytest-workflow:
    # Docs: https://github.com/ASFHyP3/actions
    uses: ASFHyP3/actions/.github/workflows/reusable-pytest.yml@v0.21.0
    with:
      local_package_name: next_pass
      python_versions: >-
        ["3.10", "3.11", "3.12", "3.13"]
