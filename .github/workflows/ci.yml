name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test ${{ matrix.environment }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        environment: ["py311", "py312", "default"]
        include:
          - os: macos-latest
            environment: default

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: latest
          environments: ${{ matrix.environment }}

      - name: Run tests with coverage
        run: pixi run -e ${{ matrix.environment }} pytest tests --cov=next_pass --cov-report=term-missing

  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: latest
          environments: lint

      - name: ruff check
        run: pixi run -e lint ruff check --output-format=github

      - name: ruff format
        if: ${{ !cancelled() }}
        run: pixi run -e lint ruff format --diff

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check for known vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install .
          pip-audit || true
