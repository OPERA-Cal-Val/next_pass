name: Overpass Map

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/next_pass/viewer_assets/**'
      - 'src/next_pass/schedule.py'
      - '.github/workflows/overpass-map.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Pixi
        shell: bash
        env:
          PIXI_NO_PATH_UPDATE: "1"
        run: |
          curl --fail --silent --show-error --location https://pixi.sh/install.sh --output "$RUNNER_TEMP/install-pixi.sh"
          bash "$RUNNER_TEMP/install-pixi.sh"
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install default environment
        run: pixi install --locked -e default

      - name: Build weekly overpass schedule
        run: pixi run next-pass-schedule --days 7 --days-back 14 --output site/data/upcoming_passes.parquet

      - name: Validate schedule sources
        run: |
          pixi run python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(
              Path("site/data/upcoming_passes.meta.json").read_text(encoding="utf-8")
          )
          status = metadata.get("sources", {}).get("landsat")
          if status != "ok":
              raise SystemExit(f"Landsat schedule source failed: {status!r}")
          PY

      - name: Assemble site
        run: cp src/next_pass/viewer_assets/index.html site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
