[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "next-pass"
version = "1.3.0"
description = "Predict the next satellite overpass (S1/S2/L8/L9) over an AOI and query OPERA products."
readme = "README.md"
requires-python = ">=3.10"

license = { file = "LICENSE" }

authors = [
  { name = "Emre Havazli, Ines Fenni, Cole Speed, and OPERA Disaster Response Team" },
]

keywords = [
  "satellite",
  "remote-sensing",
  "sar",
  "sentinel-1",
  "sentinel-2",
  "landsat",
  "opera",
  "earth-observation",
  "overpass",
]

classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
]

dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }


[project.urls]
Homepage = "https://github.com/OPERA-Cal-Val/next_pass"
Source = "https://github.com/OPERA-Cal-Val/next_pass"
Issues = "https://github.com/OPERA-Cal-Val/next_pass/issues"

[project.scripts]
"next-pass" = "next_pass:main"

[tool.setuptools]
py-modules = ["next_pass"]

[tool.setuptools.packages.find]
include = ["utils"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: marks tests as integration tests (hitting live APIs)",
    "slow: marks tests as slow running",
]

[tool.coverage.run]
source = ["utils", "."]
omit = [
    "tests/*",
    "setup.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
