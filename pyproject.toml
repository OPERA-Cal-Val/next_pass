[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "next-pass"
version = "1.4.0"
description = "Predict the next satellite overpass (S1/S2/L8/L9/NISAR) over an AOI and query OPERA products."
readme = "README.md"
requires-python = ">=3.11"

license = { file = "LICENSE" }

authors = [
  { name = "Emre Havazli, Ines Fenni, Cole Speed, and OPERA Disaster Response Team" },
]

keywords = [
  "satellite",
  "remote-sensing",
  "sar",
  "sentinel-1",
  "sentinel-2",
  "landsat",
  "nisar",
  "opera",
  "earth-observation",
  "overpass",
]

classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
  "asf_search",
  "beautifulsoup4",
  "boto3",
  "earthaccess",
  "geopandas",
  "leafmap",
  "lxml",
  "openpyxl>=3.1.5",
  "pyarrow",
  "rasterio",
  "rich>=13.0.0",
  "tabulate",
  "timezonefinder",
  "yagmail",
]

[project.optional-dependencies]
dev = [
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/OPERA-Cal-Val/next_pass"
Source = "https://github.com/OPERA-Cal-Val/next_pass"
Issues = "https://github.com/OPERA-Cal-Val/next_pass/issues"

[project.scripts]
next-pass = "next_pass:cli"
next-pass-schedule = "next_pass.schedule:cli"
next-pass-viewer = "next_pass.viewer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
next_pass = ["viewer_assets/*"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/next_pass/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: marks tests as integration tests (hitting live APIs)",
    "slow: marks tests as slow running",
    "installation: validates that the real runtime environment is installed and the CLI can start",
]

[tool.coverage.run]
source = ["next_pass"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
next-pass = { path = ".", editable = true }

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.lint.dependencies]
ruff = ">=0.16.5,<0.17"

[tool.pixi.feature.lint.tasks]
lint = "ruff check"
fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --diff"

[tool.pixi.environments]
default = { features = ["py313", "lint"], solve-group = "py313" }
py311 = { features = ["py311"], solve-group = "py311" }
py312 = { features = ["py312"], solve-group = "py312" }
lint = { features = ["lint"], no-default-feature = true }

[tool.pixi.tasks]
test = "pytest tests"
cov = "pytest tests --cov=next_pass --cov-report=term-missing"
schedule = "next-pass-schedule"
viewer = "next-pass-viewer"
lab = "jupyter lab"

[tool.pixi.dependencies]
python = ">=3.11"
asf_search = ">=13.0.0,<14"
beautifulsoup4 = ">=4.15.0,<5"
boto3 = ">=1.43.56,<2"
earthaccess = ">=0.9,<0.19"
geopandas = ">=1.1.4,<2"
leafmap = ">=0.63.0,<0.64"
lxml = ">=6.1.2,<7"
openpyxl = ">=3.1.5"
pyarrow = ">=25.0.0,<26"
rasterio = ">=1.4,<2"
rich = ">=13"
tabulate = ">=0.10.0,<0.11"
timezonefinder = ">=8.3.0,<9"
yagmail = ">=0.16.0,<0.17"
jupyterlab = ">=4.6.3,<5"
jupyter-collaboration = ">=5.0.2,<6"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
ruff = ">=0.16.5,<0.17"
pre-commit = ">=4.6.2,<5"
